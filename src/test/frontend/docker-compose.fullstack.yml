services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: walletpass
    ports:
      - "5432:5432"
    volumes:
      - wallet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d walletdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/walletdb
      DB_USERNAME: wallet
      DB_PASSWORD: walletpass
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-1234567890-abcdef}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  wallet-postgres:
